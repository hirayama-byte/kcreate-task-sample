<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>タスク管理 サンプル版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --side: #0f172a; --side-2: #1e293b; --side-line: #273449; --side-text: #94a3b8; --side-hi: #f1f5f9;
    --bg: #f1f5f9; --card: #fff; --line: #e2e8f0; --line-2: #f1f5f9;
    --text: #0f172a; --muted: #64748b; --faint: #94a3b8;
    --accent: #0d9488; --accent-2: #14b8a6; --accent-weak: #f0fdfa;
    --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; border: 1px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }
  .side ::-webkit-scrollbar-thumb { background: #334155; background-clip: padding-box; }
  .side * { scrollbar-color: #334155 transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
  .side { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 16px; border-bottom: 1px solid var(--side-line); cursor: pointer; position: relative; } /* 押すとダッシュボードに戻る */
  .brand:hover { background: var(--side-2); }
  .brand .bdg { margin-left: auto; font-family: var(--mono); font-size: 11px; background: #f59e0b; color: #111; border-radius: 999px; padding: 1px 7px; }
  .brand .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #f59e0b, #f97316); display: grid; place-items: center; }
  .brand b { display: block; color: var(--side-hi); font-size: 14px; }
  .brand small { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--side-text); }
  #tabs { padding: 12px 10px 4px; display: flex; flex-direction: column; gap: 2px; }
  #tabs button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--side-text); font: inherit; font-size: 13.5px; padding: 9px 12px; border-radius: 8px; cursor: pointer; text-align: left; }
  #tabs button svg { width: 17px; height: 17px; flex: none; opacity: .85; }
  #tabs button:hover { background: var(--side-2); color: var(--side-hi); }
  #tabs button.on { background: var(--side-2); color: #fff; box-shadow: inset 3px 0 0 #f59e0b; }
  #tabs button .bdg { margin-left: auto; font-family: var(--mono); font-size: 11px; background: #f59e0b; color: #111; border-radius: 999px; padding: 1px 7px; }
  .side-sec { padding: 14px 22px 6px; font-size: 10.5px; letter-spacing: .14em; color: #64748b; font-family: var(--mono); text-transform: uppercase; display: flex; align-items: center; }
  .side-sec button { margin-left: auto; border: 0; background: none; color: #64748b; font: inherit; font-size: 11px; cursor: pointer; }
  .side-sec button:hover { color: var(--side-hi); }
  .spacer { flex: 1; }
  #linksWrap { flex: none; border-top: 1px solid var(--side-line); padding-top: 4px; display: flex; flex-direction: column; min-height: 0; } /* 他のツールと同じく左下から詰める */
  #links { padding: 0 10px 8px; overflow: auto; max-height: 42vh; }
  #links a { display: flex; align-items: center; gap: 10px; color: var(--side-text); text-decoration: none; font-size: 13px; padding: 7px 12px; border-radius: 8px; }
  #links a:hover { background: var(--side-2); color: var(--side-hi); }
  #links a svg { width: 16px; height: 16px; flex: none; opacity: .85; }
  #links a .ext { margin-left: auto; font-size: 11px; color: #64748b; }
  .me { border: 0; border-top: 1px solid var(--side-line); background: none; font: inherit; text-align: left; width: 100%; cursor: pointer; padding: 12px 18px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--side-hi); }
  .me:hover { background: var(--side-2); }
  .me .edit-ico { margin-left: auto; color: var(--side-text); font-size: 11px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #334155; color: #e2e8f0; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .me small { display: block; color: var(--side-text); font-size: 11px; }
  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pill { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 4px 12px; }
  .pill b { font-family: var(--mono); color: var(--text); }
  main { padding: 14px 18px; flex: 1; min-height: 0; overflow: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .card-h h2 { font-size: 14px; margin: 0; }
  .card-h .sp { flex: 1; }
  .card-b { padding: 16px; }
  input, select, textarea, button.btn { font: inherit; font-size: 13.5px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  input, select, button.btn { height: 36px; padding: 0 12px; }
  textarea { padding: 10px 12px; width: 100%; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(20,184,166,.15); }
  input[type=text], input[type=url], input[type=email], input[type=date], input[type=time], input[type=number] { min-width: 0; width: 100%; }
  button.btn { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
  button.btn:hover { background: #f8fafc; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #0f766e; }
  button.danger { color: var(--danger); border-color: #fecaca; }
  button.danger:hover { background: #fef2f2; }
  button.ghost { border-color: transparent; background: none; color: var(--muted); }
  button.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .field { margin-bottom: 12px; } .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hide { display: none !important; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: var(--tb, #f1f5f9); color: var(--tc, #334155); }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tc, #64748b); }
  .tag.done { --tb: #dcfce7; --tc: #15803d; } .tag.open { --tb: #fef3c7; --tc: #b45309; } .tag.late { --tb: #fee2e2; --tc: #b91c1c; } .tag.today { --tb: #ffedd5; --tc: #c2410c; } .tag.soon { --tb: #e0f2fe; --tc: #0369a1; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.err { background: var(--danger); }
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 600px; max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal .mh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); } .modal .mh h3 { margin: 0; font-size: 15px; } .modal .mh .sp { flex: 1; }
  .modal .mb { padding: 18px; } .modal .mf { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .modal .mf .sp { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: middle; }
  thead th { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .06em; white-space: nowrap; background: #f8fafc; border-bottom: 1px solid var(--line); }
  tr.row { cursor: pointer; } tr.row:hover td { background: #f8fafc; }
  .tbl { overflow-x: auto; }
  .nm { font-weight: 500; } .sub { color: var(--faint); font-size: 12px; margin-top: 2px; }

  /* ---------- ダッシュボード ---------- */
  .dash { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 280px 250px; grid-template-rows: minmax(0, 72fr) minmax(0, 28fr); gap: 12px; } /* 上 72 : 下（メール）28 */ /* 画面全体はスクロールせず、各枠の中でスクロール */
  #boardCard { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; }
  #createCard { grid-column: 2; grid-row: 1; min-height: 0; overflow: auto; }
  #calCard { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-direction: column; min-height: 0; }
  #mailCard { grid-column: 1 / span 2; grid-row: 2; display: flex; flex-direction: column; min-height: 0; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: max-content; gap: 10px; padding: 10px; flex: 1; min-height: 0; overflow: auto; align-content: start; } /* 付箋12枚（4×3）の枠。それ以上は枠の中でスクロール */
  .note { position: relative; border-radius: 6px; padding: 8px 8px 7px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 14px -8px rgba(0,0,0,.25); cursor: pointer; border: 1px solid rgba(0,0,0,.06); transition: transform .12s; }
  .note:hover { transform: translateY(-2px); }
  .note > * { flex: none; min-height: 0; } /* 中身を縦に潰さない */
  .note.yellow { background: #fefce8; } .note.pink { background: #fce7f3; } .note.green { background: #ecfccb; } .note.blue { background: #e0f2fe; } /* 個人=黄（薄め）・重要=ピンク・チーム=黄緑・全社=水色 */
  #boardCard .card-h { flex-wrap: nowrap; } #boardCard .card-h h2, #boardCard .card-h .pill, #boardCard .card-h .btn, #boardCard .card-h .legend { flex: none; white-space: nowrap; } #boardHint { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } /* 見出しは1行に収める（足りなければ件数の文だけ省略） */
  .legend { display: inline-flex; gap: 10px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 3px; border: 1px solid rgba(0,0,0,.08); }
  .legend .yellow { background: #fde68a; } .legend .pink { background: #f9a8d4; } .legend .green { background: #bef264; } .legend .blue { background: #7dd3fc; }
  .note .nt { font-weight: 700; font-size: 13.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* 見出しは1行（見切れてよい） */
  .note .nb { font-size: 11.5px; color: #334155; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; min-height: 49px; line-height: 1.42; } /* 本文は3行（短くても3行分の高さ） */
  .note .meta { display: flex; flex-wrap: wrap; gap: 1px 8px; font-size: 11px; color: #475569; align-items: center; justify-content: space-between; } /* 左=締切・右=所要時間 */
  .note .meta .due { white-space: nowrap; }
  .note .meta .due { font-family: var(--mono); font-weight: 500; }
  .note .meta .due.late { color: var(--danger); } .note .meta .due.today { color: #c2410c; }
  .note .meta .mins { font-family: var(--mono); font-size: 13px; font-weight: 700; color: #1e293b; white-space: nowrap; margin-left: auto; } /* 所要時間（分）は少し大きく */
  .note .meta .mins.urgent { color: var(--danger); } /* 5分以内は赤 */
  .note .lbtn { border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.6); border-radius: 6px; height: 24px; padding: 0 7px; font-size: 12px; display: inline-flex; align-items: center; color: #0369a1; text-decoration: none; flex: none; white-space: nowrap; } /* リンクは完了のすぐ左 */
  .note .lbtn:hover { background: #fff; }
  .note .who { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #475569; }
  .note .who .av { width: 18px; height: 18px; border-radius: 50%; background: #334155; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }
  .note .foot { display: flex; align-items: center; gap: 3px; margin-top: 1px; flex-wrap: wrap; justify-content: flex-end; row-gap: 4px; } /* 狭い画面だけ完了ボタンを次の行へ */
  .note .foot .qbtn { margin-right: auto; width: 26px; padding: 0; justify-content: center; } /* 💬 はアイコンだけ（件数は丸い印） */
  .note .foot .qbtn.has { border-color: rgba(3,105,161,.35); }
  .note .foot .qbtn .ub { position: absolute; top: -6px; right: -7px; min-width: 16px; text-align: center; }
  .note .foot .qbtn, .note .foot .lbtn, .note .foot .donebtn { font-size: 11px; height: 24px; }
  .note .foot .lbtn { padding: 0 4px; gap: 1px; } .note .foot .donebtn { padding: 0 7px; }
  .note .foot .sp { flex: 1; }
  .note .qbtn { border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.6); border-radius: 6px; height: 24px; padding: 0 8px; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: #334155; position: relative; }
  .note .qbtn:hover { background: #fff; }
  .note .qbtn .ub { background: var(--danger); color: #fff; border-radius: 999px; font-size: 10px; font-family: var(--mono); padding: 0 5px; line-height: 16px; }
  .note .donebtn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; height: 24px; padding: 0 9px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; }
  .note .qbtn { white-space: nowrap; flex: none; padding: 0 6px; }
  .note .who { flex-wrap: wrap; } .note .who .prog { margin-left: auto; white-space: nowrap; }
  .note .donebtn:hover { background: #0f766e; }
  .note .donebtn.sent { background: #fff; color: #334155; border-color: rgba(0,0,0,.15); }
  .note .prog { font-size: 11px; font-family: var(--mono); color: #475569; }
  .board .empty { grid-column: 1 / -1; }
  .board.more::after { content: ""; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .checks { max-height: 150px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; } /* 相手のチェック一覧（外したい人はチェックを外す） */
  .checks label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); margin: 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
  .checks label.off { color: var(--faint); text-decoration: line-through; }
  .checks input { width: auto; height: auto; margin: 0; flex: none; }
  .chip { font: inherit; font-size: 12px; background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; height: auto; }
  .chip.on { background: var(--accent-weak); color: var(--accent); border-color: #99f6e4; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; font: inherit; font-size: 13px; padding: 0 12px; height: 34px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  /* 本日のスケジュール */
  .cal { position: relative; padding: 8px 10px 12px 10px; overflow: auto; flex: 1; min-height: 0; }
  .cal .allday { margin: 0 0 8px 44px; display: flex; flex-direction: column; gap: 4px; }
  .cal .tl { position: relative; }
  .cal .hr { height: 44px; border-top: 1px solid var(--line-2); position: relative; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .cal .hr span { position: absolute; top: -8px; left: 0; background: #fff; padding-right: 4px; }
  .cal .ev { position: absolute; left: 44px; right: 4px; border-radius: 6px; padding: 4px 8px; font-size: 12px; line-height: 1.35; overflow: hidden; color: #fff; background: #0ea5e9; border-left: 3px solid rgba(0,0,0,.25); box-shadow: 0 1px 2px rgba(0,0,0,.15); text-decoration: none; }
  .cal .ev b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .ev small { font-family: var(--mono); font-size: 10.5px; opacity: .9; }
  .cal .ev.c1 { background: #dc2626; } .cal .ev.c2 { background: #0ea5e9; } .cal .ev.c3 { background: #16a34a; } .cal .ev.c4 { background: #7c3aed; } .cal .ev.c5 { background: #d97706; }
  .cal .ad { background: #e0f2fe; color: #0c4a6e; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 500; }
  .cal .nowline { position: absolute; left: 40px; right: 0; height: 2px; background: var(--danger); z-index: 2; }
  .cal .nowline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .calnav { display: inline-flex; gap: 2px; } .calnav button { height: 28px; padding: 0 8px; }
  /* 新着メール */
  .mail { flex: 1; min-height: 0; overflow: auto; } /* メールは枠の中でスクロール */
  .mail .m { display: grid; grid-template-columns: 110px 160px minmax(0, 1fr); gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line-2); text-decoration: none; color: inherit; align-items: baseline; }
  .mail .m:hover { background: #f8fafc; }
  .mail .m .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .mail .m .f { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail .m .s { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail .m .s small { color: var(--faint); font-size: 12px; margin-left: 8px; }
  /* 詳細 */
  .detail .body { white-space: pre-wrap; line-height: 1.7; background: #fafafa; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
  .detail dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; margin: 12px 0; font-size: 13px; }
  .detail dt { color: var(--muted); } .detail dd { margin: 0; }
  .detail .people { display: flex; flex-direction: column; gap: 4px; }
  .detail .people div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .detail .people .t { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .thread { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow: auto; margin-bottom: 10px; }
  .thread .c { background: #f1f5f9; border-radius: 10px; padding: 8px 12px; max-width: 86%; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .thread .c.mine { background: var(--accent-weak); align-self: flex-end; }
  .thread .c.new { box-shadow: inset 0 0 0 1px #fca5a5; }
  .thread .c small { display: block; color: var(--muted); font-size: 11px; font-family: var(--mono); margin-bottom: 2px; }
  .ask { display: flex; gap: 8px; align-items: flex-end; } .ask textarea { min-height: 60px; }
  .remind li { margin: 4px 0; line-height: 1.6; } .remind li b { cursor: pointer; color: #0369a1; }
  .notice { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; line-height: 1.7; margin-bottom: 14px; }
  .linkrows div { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 8px; margin-bottom: 8px; }
  @media (max-width: 1280px) {
    .dash { grid-template-columns: minmax(0, 1fr) 280px; }
    #calCard { grid-column: 2; grid-row: 2; } #mailCard { grid-column: 1; grid-row: 2; } #createCard { grid-column: 2; grid-row: 1; }
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cal { max-height: 320px; }
  }
  .mcreate { display: none; }

<body>
<div class="app">
  <aside class="side">
    <div class="brand" id="brand" title="ダッシュボードに戻る"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><div><b>タスク管理</b><small>K-CREATE</small></div><span class="bdg hide" id="bdgBoard" title="返事・質問の未読"></span></div>
    <button class="mcreate" id="mCreate">＋ タスクの作成</button>
    <nav id="tabs">
      <button data-tab="sent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>発信したタスク<span class="bdg hide" id="bdgSent"></span></button>
      <button data-tab="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>完了したタスク</button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>設定</button>
    </nav>
    <div class="spacer"></div>
    <div id="linksWrap"><div class="side-sec">リンク集<button id="linksEdit" class="hide" title="リンク集を編集">編集</button></div><div id="links"></div></div>
    <button class="me" id="meBtn"><span class="avatar" id="meAv">?</span><span><span id="meName">名前を登録</span><small id="meMail"></small></span><span class="edit-ico">変更</span></button>
  </aside>
  <div class="main">
    <main>
      <!-- ダッシュボード -->
      <section id="dash" class="dash">
        <div class="card" id="boardCard">
          <div class="card-h"><h2>タスク管理一覧</h2><span class="hint" id="boardHint"></span><span class="sp"></span><span class="legend"><span><i class="yellow"></i>個人</span><span><i class="pink"></i>重要</span><span><i class="green"></i>チーム</span><span><i class="blue"></i>全社</span></span><button class="btn sm" id="doneBtn">完了したタスク</button><button class="btn sm ghost" id="boardReload" title="最新に更新">⟳</button></div>
          <div class="board" id="board"></div>
        </div>
        <div class="card" id="createCard">
          <div class="card-h"><h2>タスクの作成</h2></div>
          <div class="card-b">
            <div class="field"><label>見出し</label><input id="cTitle" type="text" placeholder="例: 11月号 入稿確認"></div>
            <div class="field"><label>内容</label><textarea id="cBody" rows="3" placeholder="やることの説明"></textarea></div>
            <div class="row2"><div class="field"><label>締切</label><input id="cDue" type="date"></div><div class="field"><label>時刻（任意）</label><input id="cDueTime" type="time"></div></div>
            <div class="row2"><div class="field"><label>所要時間（分）</label><input id="cMins" type="number" min="1" step="5" placeholder="例: 30"></div><div class="field"><label>重要</label><label style="display:flex;align-items:center;gap:6px;height:36px;font-size:13px;cursor:pointer"><input type="checkbox" id="cImportant" style="width:auto;height:auto;margin:0">重要（ピンク）</label></div></div>
            <div class="field"><label>リンク（任意）</label><input id="cLink" type="url" placeholder="https://"></div>
            <div class="field"><label>誰のタスク</label><div class="seg"><button id="cSelf" class="on">個人</button><button id="cTeam">チーム</button><button id="cCompany">全社</button></div></div>
            <div class="field hide" id="cToWrap"><label style="display:flex;align-items:center;gap:4px"><span id="cToLabel">共有する相手</span>（<b id="cToN">0</b> 人）<span style="flex:1"></span><button class="btn sm ghost" id="cAll" style="height:22px;padding:0 6px;font-size:11px">全員</button><button class="btn sm ghost" id="cNone" style="height:22px;padding:0 6px;font-size:11px">解除</button></label><div class="checks" id="cTo"></div><label class="hint" style="margin-top:8px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="cMe" style="width:auto;height:auto;margin:0">自分のボードにも入れる</label></div>
            <button class="btn primary" id="cSave" style="width:100%;justify-content:center">タスクを作成</button>
          </div>
        </div>
        <div class="card" id="calCard">
          <div class="card-h"><h2 id="calTitle">本日のスケジュール</h2><span class="sp"></span><span class="calnav"><button class="btn sm" id="calPrev">‹</button><button class="btn sm" id="calToday">今日</button><button class="btn sm" id="calNext">›</button></span><a class="btn sm" id="calOpen" href="https://calendar.google.com/" target="_blank" rel="noopener" style="text-decoration:none">カレンダーを開く ↗</a></div>
          <div class="cal" id="cal"><div class="empty">読み込み中…</div></div>
        </div>
        <div class="card" id="mailCard">
          <div class="card-h"><h2>Gmail の新着</h2><span class="pill hide" id="mailUnread">未読 <b id="mailN">0</b> 件</span><span class="sp"></span><span class="hint" id="mailAt"></span><a class="btn sm" href="https://mail.google.com/" target="_blank" rel="noopener" style="text-decoration:none">Gmail を開く ↗</a><button class="btn sm ghost" id="mailReload" title="最新に更新">⟳</button></div>
          <div class="mail" id="mail"><div class="empty">読み込み中…</div></div>
        </div>
      </section>

      <!-- 発信したタスク -->
      <section id="sent" class="hide">
        <div class="card">
          <div class="card-h"><h2>発信したタスク（未完了）</h2><span class="hint">誰が完了したか・まだ対応していないかが分かります。行をクリックで詳細・質問</span><span class="sp"></span><span class="hint" id="sentCount"></span></div>
          <div class="tbl"><table><thead><tr><th>締切</th><th>見出し</th><th>相手</th><th>進み具合</th><th>質問</th><th>リマインド</th></tr></thead><tbody id="sentBody"></tbody></table></div>
          <div class="empty hide" id="sentEmpty">発信した未完了のタスクはありません</div>
        </div>
      </section>

      <!-- 完了したタスク -->
      <section id="done" class="hide">
        <div class="card">
          <div class="card-h"><h2>完了したタスク</h2><span class="sp"></span><input id="doneMonth" type="month" style="width:160px"><button class="btn sm" id="doneAll">すべて</button></div>
          <div class="tbl"><table><thead><tr><th>完了日時</th><th>見出し</th><th>種類</th><th>発信者</th><th>締切</th><th></th></tr></thead><tbody id="doneBody"></tbody></table></div>
          <div class="empty hide" id="doneEmpty">完了したタスクはまだありません</div>
        </div>
      </section>

      <!-- 設定 -->
      <section id="settings" class="hide">
        <div class="card" style="max-width:640px;margin-bottom:16px"><div class="card-h"><h2>自分の設定</h2></div>
          <div class="card-b">
            <div class="field"><label>名前（タスクの発信者・相手として表示されます）</label><input id="sName" type="text"></div>
            <div class="field"><label>部署・役職（任意）</label><input id="sTitle" type="text"></div>
            <button class="btn primary" id="sSave">保存</button>
          </div>
        </div>
        <div class="card hide" style="max-width:640px;margin-bottom:16px" id="adminCard"><div class="card-h"><h2>管理者の設定</h2></div>
          <div class="card-b">
            <div class="row2"><div class="field"><label>自動更新の間隔（分）</label><input id="aRemind" type="number" min="1" max="120"></div><div class="field"><label>スケジュールの表示時間（開始〜終了）</label><div class="row2"><input id="aFrom" type="number" min="0" max="23"><input id="aTo" type="number" min="1" max="24"></div></div></div>
            <button class="btn primary" id="aSave">保存</button>
            <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
            <div class="field"><label>メンバーの名前を代理で登録（まだ使っていない人の事前登録にも）</label><div class="row2"><input id="aEmail" type="email" placeholder="メールアドレス"><input id="aName" type="text" placeholder="名前（フルネーム）"></div></div>
            <button class="btn" id="aMember">登録</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>// Apps Script の最小限のモック（テスト用）。Node でもブラウザでも動く
(function (root) {

      userProps: {},

      Utilities: { formatDate: function (d, tz, f) {

      // 送ったメールは env.mails に溜まる。MailApp の残り通数は 1500 − 今日送った数（送信者ごと）
      mails: [],
      // 受信トレイ（人ごと）: env.inbox[user] = [{id, from, subject, date(Date), body, unread}]。カレンダー: env.calendar[user] = [{id, title, start(Date), end(Date), allDay, location}]
      inbox: {}, calendar: {},
      GmailApp: { sendEmail: function (to, subject, body, opt) {
        if (/@fail\./.test(to)) throw new Error('Invalid email: ' + to);
        env.mails.push({ from: env.user, to: to, subject: subject, body: body, htmlBody: (opt || {}).htmlBody || '', name: (opt || {}).name || '', at: Date.now() });
      },
      search: function (q, start, max) {

    '<h4 style="margin:14px 0 8px;font-size:13px">質問・返事</h4><div class="thread" id="thread">' + threadHtml(t.comments) + '</div>' +
    '<div class="ask"><textarea id="askText" placeholder="' + (t.isCreator ? '返事や補足を書く（相手に届きます）' : '質問を書く（' + esc(t.creatorName) + ' さんに届きます）') + '"></textarea><button class="btn primary" id="askSend">送る</button></div></div>' +
    '<div class="mf">' + (t.isCreator || (S.me && S.me.isAdmin) ? '<button class="btn danger" id="dDel">削除</button><button class="btn" id="dEdit">変更</button>' : '') + (t.isCreator && t.scope === 'share' && t.doneCount < t.assignees.length ? '<button class="btn" id="dRemind" title="まだ完了していない人にリマインドを送る">🔔 リマインド</button>' : '') + '<span class="sp"></span><button class="btn" data-close>閉じる</button>' +
    (t.myStatus === 'open' ? '<button class="btn primary" id="dDone">✓ 完了にする</button>' : t.myStatus === 'done' ? '<button class="btn" id="dReopen">未完了に戻す</button>' : '') + '</div>';
  var bg = modal(html, function (bg) {
    var th = bg.querySelector('#thread'); th.scrollTop = th.scrollHeight;
    if (focusAsk) bg.querySelector('#askText').focus();
    bg.querySelector('#askSend').onclick = function () {
      var v = bg.querySelector('#askText').value;
      if (!v.trim()) { toast('内容を入力してください', true); return; }
      call('addComment', t.id, v).then(function (r) { bg.querySelector('#askText').value = ''; th.innerHTML = threadHtml(r.comments); th.scrollTop = th.scrollHeight; [S.board, S.sent].forEach(function (list) { list.forEach(function (x) { if (x.id === t.id) x.comments = r.comments.length; }); }); renderBoard(); toast(t.isCreator ? '相手に送りました' : t.creatorName + ' さんに送りました'); }).catch(fail);
    };
    var d = bg.querySelector('#dDone'); if (d) d.onclick = function () { bg.remove(); doComplete(t.id); };
    var r = bg.querySelector('#dReopen'); if (r) r.onclick = function () { call('reopenTask', t.id).then(function () { bg.remove(); toast('未完了に戻しました'); reloadBoard(); if (S.tab === 'done') loadDone(); }).catch(fail); };
    var e = bg.querySelector('#dEdit'); if (e) e.onclick = function () { bg.remove(); editModal(t); };
    var rm = bg.querySelector('#dRemind'); if (rm) rm.onclick = function () { bg.remove(); doRemind(t.id); };
    var x = bg.querySelector('#dDel'); if (x) x.onclick = function () {
      modal('<div class="mh"><h3>このタスクを削除しますか？</h3></div><div class="mb"><p style="margin:0">「' + esc(t.title) + '」' + (t.scope === 'share' ? 'は相手のボードからも消えます。' : 'を削除します。') + '</p></div><div class="mf"><button class="btn" data-close>やめる</button><button class="btn danger" id="delYes">削除する</button></div>', function (b2) {
        b2.querySelector('#delYes').onclick = function () { call('deleteTask', t.id).then(function () { b2.remove(); bg.remove(); S.board = S.board.filter(function (y) { return y.id !== t.id; }); S.sent = S.sent.filter(function (y) { return y.id !== t.id; }); renderBoard(); updateBadges(); if (S.tab === 'sent') renderSent(); if (S.tab === 'done') loadDone(); toast('削除しました'); }).catch(fail); };
      });
    };
  });
}
function threadHtml(list) {
  if (!list || !list.length) return '<p class="hint" style="margin:0">まだ書き込みはありません</p>';
  return list.map(function (c) { return '<div class="c' + (c.mine ? ' mine' : '') + (c.wasUnread ? ' new' : '') + '"><small>' + esc(c.name) + ' ・ ' + fmtDt(c.created) + (c.wasUnread ? ' ・ 新着' : '') + '</small>' + esc(c.body) + '</div>'; }).join('');
}
function editModal(t) {
  var others = S.members.filter(function (m) { return m.email !== t.creator; });
  var cur = {}; t.assignees.forEach(function (a) { cur[a.email] = 1; });
  modal('<div class="mh"><h3>タスクの変更</h3></div><div class="mb">' +
    '<div class="field"><label>見出し</label><input id="eTitle" type="text" value="' + esc(t.title) + '"></div>' +
    '<div class="field"><label>内容</label><textarea id="eBody" rows="4">' + esc(t.body) + '</textarea></div>' +
    '<div class="row2"><div class="field"><label>締切</label><input id="eDue" type="date" value="' + esc(t.due) + '"></div><div class="field"><label>時刻（任意）</label><input id="eDueTime" type="time" value="' + esc(t.dueTime) + '"></div></div>' +
    '<div class="row2"><div class="field"><label>所要時間（分）</label><input id="eMins" type="number" min="1" step="5" value="' + esc(t.minutes) + '"></div><div class="field"><label>重要</label><label style="display:flex;align-items:center;gap:6px;height:36px;font-size:13px;cursor:pointer"><input type="checkbox" id="eImportant" style="width:auto;height:auto;margin:0"' + (t.important ? ' checked' : '') + '>重要タスク（ピンク）</label></div></div>' +
    '<div class="field"><label>リンク</label><input id="eLink" type="url" value="' + esc(t.link) + '"></div>' +
    (t.scope === 'share' ? '<div class="field"><label>相手を足す（外すことはできません）</label><div class="chips" id="eTo">' + others.map(function (m) { return '<button class="chip' + (cur[m.email] ? ' on' : '') + '" data-e="' + esc(m.email) + '"' + (cur[m.email] ? ' disabled' : '') + '>' + esc(m.name) + '</button>'; }).join('') + '</div></div>' : '') +
    '</div><div class="mf"><button class="btn" data-close>やめる</button><button class="btn primary" id="eSave">保存</button></div>', function (bg) {
    var add = {};
    bg.querySelectorAll('#eTo .chip:not(:disabled)').forEach(function (b) { b.onclick = function () { if (add[b.dataset.e]) delete add[b.dataset.e]; else add[b.dataset.e] = 1; b.classList.toggle('on'); }; });
    bg.querySelector('#eSave').onclick = function () {
      call('updateTask', t.id, { title: bg.querySelector('#eTitle').value, body: bg.querySelector('#eBody').value, due: bg.querySelector('#eDue').value, dueTime: bg.querySelector('#eDueTime').value, minutes: bg.querySelector('#eMins').value, link: bg.querySelector('#eLink').value, important: bg.querySelector('#eImportant').checked, addTo: Object.keys(add) })
        .then(function () { bg.remove(); toast('変更しました'); reloadBoard(); }).catch(fail);
    };
  });
}

// ---------- 発信したタスク ----------
function renderSent() {
  var list = S.sent;
  $('sentBody').innerHTML = list.map(function (t) {
    var c = dueClass(t);
    return '<tr class="row" data-id="' + esc(t.id) + '"><td class="mono" style="white-space:nowrap;' + (c === 'late' ? 'color:var(--danger)' : '') + '">' + esc(dueLabel(t)) + '</td><td><div class="nm">' + esc(t.title) + '</div>' + (t.body ? '<div class="sub">' + esc(t.body.slice(0, 60)) + '</div>' : '') + '</td>' +
      '<td style="font-size:12.5px">' + t.assignees.map(function (a) { return '<span class="tag ' + (a.status === 'done' ? 'done' : 'open') + '" title="' + (a.status === 'done' ? fmtDt(a.doneAt) + ' 完了' : a.seenAt ? '開いたが未対応' : 'まだ開いていない') + '">' + esc(a.name) + '</span>'; }).join(' ') + '</td>' +
      '<td class="mono">' + t.doneCount + ' / ' + t.assignees.length + '</td><td>' + (t.unread ? '<span class="tag late">返事待ち ' + t.unread + '</span>' : t.comments ? '<span class="hint">' + t.comments + ' 件</span>' : '') + '</td>' +
      '<td style="white-space:nowrap">' + (t.doneCount < t.assignees.length ? '<button class="btn sm" data-remind title="まだ完了していない人にリマインドを送る">🔔 リマインド</button>' : '') + (lastRemind(t) ? '<div class="hint" style="margin-top:3px">送信 ' + fmtDt(lastRemind(t)) + '</div>' : '') + '</td></tr>';
  }).join('');
  $('sentEmpty').classList.toggle('hide', !!list.length);
  $('sentCount').textContent = list.length ? list.length + ' 件' : '';
  $('sentBody').querySelectorAll('tr').forEach(function (tr) {
    tr.onclick = function (e) { if (e.target.closest('[data-remind]')) return; openTask(tr.dataset.id); };
    var b = tr.querySelector('[data-remind]'); if (b) b.onclick = function (e) { e.stopPropagation(); doRemind(tr.dataset.id, b); };
  });
}
function lastRemind(t) { return t.assignees.reduce(function (m, a) { return a.remindAt > m ? a.remindAt : m; }, ''); }
function doRemind(id, btn) {
  if (btn) btn.disabled = true;
  call('sendReminder', id).then(function (r) { toast(r.count + ' 人にリマインドしました（' + r.names.join('・') + '）'); reloadBoard(); }).catch(function (e) { if (btn) btn.disabled = false; fail(e); });
}

// ---------- 完了したタスク ----------
function loadDone() {
  var month = $('doneMonth').value;
  $('doneBody').innerHTML = '<tr><td colspan="6" class="hint">読み込み中…</td></tr>';
  call('listDone', month || '').then(function (list) {
    $('doneBody').innerHTML = list.map(function (t) {
      var kind = t.kind === 'self' ? '自分用' : t.kind === 'assigned' ? '共有（自分の分）' : '発信（全員完了）';
      return '<tr class="row" data-id="' + esc(t.id) + '"><td class="mono" style="white-space:nowrap">' + fmtDt(t.finished) + '</td><td><div class="nm">' + esc(t.title) + '</div>' + (t.body ? '<div class="sub">' + esc(t.body.slice(0, 60)) + '</div>' : '') + '</td><td><span class="tag done">' + kind + '</span></td><td>' + esc(t.creatorName) + '</td><td class="mono">' + esc(t.due ? fmtYmd(t.due) : '−') + '</td>' +
        '<td>' + (t.kind !== 'sent' ? '<button class="btn sm" data-reopen>戻す</button>' : '') + '</td></tr>';
    }).join('');
    $('doneEmpty').classList.toggle('hide', !!list.length);
    $('doneBody').querySelectorAll('tr').forEach(function (tr) {
      tr.onclick = function (e) { if (e.target.closest('[data-reopen]')) return; openTask(tr.dataset.id); };
      var b = tr.querySelector('[data-reopen]'); if (b) b.onclick = function (e) { e.stopPropagation(); call('reopenTask', tr.dataset.id).then(function () { toast('未完了に戻しました'); loadDone(); reloadBoard(); }).catch(fail); };
    });
  }).catch(fail);
}
$('doneMonth').onchange = loadDone;
$('doneAll').onclick = function () { $('doneMonth').value = ''; loadDone(); };

// ---------- 本日のスケジュール ----------
function loadCal(force) {
  var d = S.calDate || S.today;
  var el = $('cal');
  $('calTitle').textContent = (d === S.today ? '本日のスケジュール（' + fmtYmd(d) + '）' : fmtYmd(d) + ' のスケジュール');
  $('calOpen').href = 'https://calendar.google.com/calendar/u/0/r/day/' + d.replace(/-/g, '/');
  if (S.calCache[d] && !force) { renderCal(S.calCache[d]); return Promise.resolve(); }
  el.innerHTML = '<div class="empty">読み込み中…</div>';
  return call('getCalendar', d).then(function (r) { S.calCache[r.date] = r; if (r.date === (S.calDate || S.today)) renderCal(r); }).catch(function (e) { el.innerHTML = '<div class="empty">カレンダーを読めませんでした<br><span class="hint">' + esc(e.message || e) + '</span></div>'; });
}
function renderCal(r) {
  var from = S.settings.cal_from || 8, to = S.settings.cal_to || 20, H = 44;
  var timed = r.events.filter(function (e) { return !e.allDay; }), allday = r.events.filter(function (e) { return e.allDay; });
  function mins(hm, def) { if (!hm) return def; var p = hm.split(':'); return (+p[0]) * 60 + (+p[1]); }
  var lo = from * 60, hi = to * 60;
  timed.forEach(function (e) { var s = e.startYmd < r.date ? 0 : mins(e.start, lo); var en = e.endYmd > r.date ? 1440 : mins(e.end, hi); lo = Math.min(lo, Math.floor(s / 60) * 60); hi = Math.max(hi, Math.ceil(en / 60) * 60); });
  var html = '';
  if (allday.length) html += '<div class="allday">' + allday.map(function (e) { return '<div class="ad">' + esc(e.title) + '</div>'; }).join('') + '</div>';
  html += '<div class="tl" style="height:' + ((hi - lo) / 60 * H) + 'px">';
  for (var m = lo; m < hi; m += 60) html += '<div class="hr"><span>' + ('0' + (m / 60)).slice(-2) + ':00</span></div>';
  timed.forEach(function (e, i) {
    var s = e.startYmd < r.date ? 0 : mins(e.start, lo), en = e.endYmd > r.date ? 1440 : mins(e.end, hi);
    var top = (Math.max(s, lo) - lo) / 60 * H, h = Math.max((Math.min(en, hi) - Math.max(s, lo)) / 60 * H - 2, 22);
    var href = 'https://calendar.google.com/calendar/u/0/r/day/' + r.date.replace(/-/g, '/');
    html += '<a class="ev c' + (i % 5 + 1) + '" href="' + href + '" target="_blank" rel="noopener" style="top:' + top + 'px;height:' + h + 'px" title="' + esc(e.title) + (e.location ? ' @ ' + e.location : '') + '"><b>' + esc(e.title) + '</b><small>' + esc(e.start) + '〜' + esc(e.end) + '</small></a>';
  });
  if (r.date === S.today) { var n = new Date(), nm = n.getHours() * 60 + n.getMinutes(); if (nm >= lo && nm <= hi) html += '<div class="nowline" style="top:' + ((nm - lo) / 60 * H) + 'px"></div>'; }
  html += '</div>';
  if (!r.events.length) html = '<div class="empty" style="padding:14px">予定はありません</div>' + html;
  $('cal').innerHTML = html;
}
function shiftCal(n) { var d = new Date((S.calDate || S.today) + 'T00:00:00'); d.setDate(d.getDate() + n); S.calDate = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); loadCal(); }
$('calPrev').onclick = function () { shiftCal(-1); }; $('calNext').onclick = function () { shiftCal(1); }; $('calToday').onclick = function () { S.calDate = S.today; loadCal(true); };

// ---------- 新着メール ----------
function loadMail() {
  var el = $('mail');
  if (!S.mail) el.innerHTML = '<div class="empty">読み込み中…</div>';
  return call('getMail').then(function (r) {
    S.mail = r;
    $('mailN').textContent = r.unread; $('mailUnread').classList.toggle('hide', !r.unread);
    $('mailAt').textContent = String(r.fetched).slice(11) + ' 時点';
    el.innerHTML = r.list.map(function (m) {
      return '<a class="m" href="https://mail.google.com/mail/u/0/#inbox/' + esc(m.id) + '" target="_blank" rel="noopener"><span class="d">' + esc(fmtDt(m.date)) + '</span><span class="f" title="' + esc(m.fromEmail) + '">' + esc(m.from) + '</span><span class="s">' + esc(m.subject) + (m.count > 1 ? ' (' + m.count + ')' : '') + '<small>' + esc(m.snippet) + '</small></span></a>';
    }).join('') || '<div class="empty" style="padding:20px">未読のメールはありません</div>';
  }).catch(function (e) { el.innerHTML = '<div class="empty">メールを読めませんでした<br><span class="hint">' + esc(e.message || e) + '</span></div>'; });
}
$('mailReload').onclick = function () { loadMail().then(function () { toast('更新しました'); }); };

// ---------- リマインド（画面を開いている間だけ） ----------
function startTimer() {
  if (S.timer) clearInterval(S.timer);
  var min = Math.max(1, Number(S.settings.remind_minutes) || 5);
  S.timer = setInterval(function () { reloadBoard().then(function () { loadMail(); if ((S.calDate || S.today) === S.today) loadCal(true); }).catch(function () {}); }, min * 60000);
}
// 発信者が「リマインド」を押したタスクだけ、担当者（未完了）にポップアップ。「確認した」で消える
function showReminders(list) {
  list = list || [];
  if (!list.length || S.remindOpen) return;
  S.remindOpen = true;
  var ids = list.map(function (r) { return r.id; });
  modal('<div class="mh"><h3>🔔 リマインド</h3><span class="sp"></span><span class="hint">' + list.length + ' 件</span></div><div class="mb remind"><ul style="margin:0;padding-left:18px">' + list.map(function (r) { return '<li><b data-id="' + esc(r.id) + '">' + esc(r.creatorName) + ' さんからリマインド: ' + esc(r.title) + '</b><span class="hint">（' + esc(dueLabel(r)) + '・' + fmtDt(r.remindAt) + '）</span></li>'; }).join('') + '</ul></div><div class="mf"><button class="btn primary" id="remindOk">確認した</button></div>', function (bg) {
    function done(openId) { call('markRemindersSeen', ids).then(function () { S.reminders = []; }).catch(function () {}); S.remindOpen = false; bg.remove(); if (openId) openTask(openId); }
    bg.querySelector('#remindOk').onclick = function () { done(); };
    bg.querySelectorAll('b[data-id]').forEach(function (b) { b.onclick = function () { done(b.dataset.id); }; });
    bg.onclick = function (e) { if (e.target === bg) { S.remindOpen = false; } };
  });
}

// ---------- 設定 ----------
function renderSettings() {
  $('sName').value = S.me.name || ''; $('sTitle').value = S.me.title || '';
  $('aRemind').value = S.settings.remind_minutes; $('aFrom').value = S.settings.cal_from; $('aTo').value = S.settings.cal_to;
}
$('sSave').onclick = function () { call('setMyProfile', { name: $('sName').value, title: $('sTitle').value }).then(function (me) { me.isAdmin = S.me.isAdmin; S.me = me; toast('保存しました'); boot(); }).catch(fail); };
$('aSave').onclick = function () { call('setSettings', { remind_minutes: $('aRemind').value, cal_from: $('aFrom').value, cal_to: $('aTo').value }).then(function () { S.settings.remind_minutes = Number($('aRemind').value); S.settings.cal_from = Number($('aFrom').value); S.settings.cal_to = Number($('aTo').value); startTimer(); loadCal(true); toast('保存しました'); }).catch(fail); };
$('aMember').onclick = function () { call('setMemberProfile', $('aEmail').value, { name: $('aName').value }).then(function (m) { toast(m.name + ' さんを登録しました'); $('aEmail').value = ''; $('aName').value = ''; boot(); }).catch(fail); };

boot();
</script>
